name: Publish Advoo Proxy Authentication Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: advoo-proxy-auth-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ANIMO-TECH/sing-box'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
      - name: Verify external authentication and static compatibility
        run: go test -race -timeout 90s ./common/authenticator ./transport/trojan ./protocol/trojan
      - name: Build binary with upstream container feature flags
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(go run ./cmd/internal/read_tag)-advoo-${GITHUB_SHA::8}"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS="$(cat release/LDFLAGS)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags "$TAGS" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION $LDFLAGS -s -w -buildid=" \
            -o sing-box-amd64 ./cmd/sing-box
          ./sing-box-amd64 version
          echo "IMAGE=ghcr.io/animo-tech/sing-box:proxy-auth-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - name: Login to organization registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.binary --build-arg TARGETARCH=amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
